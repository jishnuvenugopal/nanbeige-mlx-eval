[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanbeige-mlx-eval"
version = "0.2.0"
description = "Nanbeige4.2-3B MLX Evaluation Harness – bilingual agentic-readiness eval + fidelity gate on Apple Silicon"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Jishnu Venugopal" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# nanbeige-mlx owns the port (single source of truth); the eval depends on it.
# jsonschema is a runtime dep: a grader that can't grade must never silently pass.
dependencies = [
    "nanbeige-mlx>=0.2.0,<0.3",
    "mlx>=0.32,<0.34",
    # Upper-bounded to match nanbeige-mlx: the port imports mlx-lm internals.
    # See the note in nanbeige_mlx/pyproject.toml.
    "mlx-lm>=0.31,<0.33",
    "transformers>=4.40",
    "huggingface_hub>=1.20",
    "numpy>=2.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/jishnuvenugopal/nanbeige-mlx-eval"
Repository = "https://github.com/jishnuvenugopal/nanbeige-mlx-eval"
Issues = "https://github.com/jishnuvenugopal/nanbeige-mlx-eval/issues"
"Investigation log" = "https://github.com/jishnuvenugopal/nanbeige-mlx-eval/blob/main/docs/investigation-log.md"
"MLX port package" = "https://github.com/jishnuvenugopal/nanbeige-mlx"

[project.scripts]
nanbeige-mlx-eval = "nanbeige_mlx_eval.cli:main"

[tool.setuptools.packages.find]
include = ["nanbeige_mlx_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
