[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-nanbeige"
version = "0.2.0"
description = "MLX port of the Nanbeige4.2-3B Looped Transformer for Apple Silicon — model definition, HF->MLX conversion, and publish helpers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Jishnu Venugopal" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Pinned to the mlx-lm internals the shipped model_file depends on
# (mlx_lm.models.base / .cache; see model.py). C1/C2 in CODE_REVIEW.md.
dependencies = [
    "mlx>=0.32",
    "mlx-lm>=0.31",
    "huggingface_hub>=1.20",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
mlx-nanbeige-convert = "mlx_nanbeige.convert:main"
mlx-nanbeige-upload = "mlx_nanbeige.upload:main"

[tool.setuptools]
packages = ["mlx_nanbeige"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
